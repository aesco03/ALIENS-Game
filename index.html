function createBoardTiles() {
    let tiles = [];
    let size = 32; 
    let margin = 5;
    let x = 40;    
    let y = 580;   

    const addTiles = (count, dx, dy) => {
        for(let i=0; i<count; i++) {
            let tileType = "red"; // Default

            if ((tiles.length + 1) % 11 === 0) tileType = "blue";
            else if ((tiles.length + 1) % 3 === 0) tileType = "green";
            if (SHORTCUTS[tiles.length]) tileType = "gold";

            tiles.push({x: x, y: y, w: size, h: size, type: tileType});
            
            x += dx * (size + margin);
            y += dy * (size + margin);
        }
        x -= dx * (size + margin);
        y -= dy * (size + margin);
    };

    addTiles(15, 1, 0);  
    addTiles(5, 0, -1);  
    addTiles(10, -1, 0); 
    addTiles(5, 0, -1);  
    addTiles(15, 1, 0);  
    addTiles(5, 0, -1);  
    addTiles(13, -1, 0); 
    
    if(tiles.length > 0) tiles[tiles.length-1].type = "red";
    boardTiles = tiles;
}

// --- Logic ---

function startCombat(tileIndex) {
    let currentTile = boardTiles[tileIndex];

    if (currentTile.type === "green") {
        combatPhase = "safe";
        combatLog = ["Safe Zone!", "No aliens here."];
        return;
    }
    if (currentTile.type === "blue") {
        combatPhase = "rest";
        players[0].hp = players[0].maxHp;
        players[1].hp = players[1].maxHp;
        combatLog = ["Rest Point reached!", "Full Heal!"];
        return;
    }
    if (currentTile.type === "gold") {
        gameLog.push("Shortcut Entrance.");
        return; 
    }

    if (tileIndex === 67) {
        combatEnemy = { ...QUEEN };
    } else {
        let rand = Math.floor(Math.random() * ENEMIES.length);
        combatEnemy = { ...ENEMIES[rand] };
    }

    isShortcutFight = false;
    combatPhase = "player_turn";
    combatLog = [`A wild ${combatEnemy.name} appeared!`];
    players[currentTurn].sp = Math.min(players[currentTurn].sp + 2, players[currentTurn].maxSp);
    combatLog.push(`Player ${currentTurn+1} regains 2 SP.`);
}

function playerUseSkill(skillIndex) {
    let p = players[currentTurn];
    let ally = players[1 - currentTurn]; 
    let skill = SKILLS[p.class][skillIndex];

    let actualCost = skill.cost;
    // Efficiency Core: reduce SP cost
    if (p.efficiencyLevel > 0) {
        actualCost = Math.max(1, skill.cost - p.efficiencyLevel);
    }
    if (p.isCharging && skill.name === "Charged") actualCost = 0;

    if (p.sp < actualCost) { combatLog.push("Not enough SP!"); return; }
    if (p.isCharging && skill.name !== "Charged") { combatLog.push("Must use Charged Punch!"); return; }

    p.sp -= actualCost;

    let dmg = 0;
    let selfDmg = 0;

    if (skill.name === "Strike") dmg = 20;
    else if (skill.name === "Slash") { selfDmg = 15; dmg = 35; }
    else if (skill.name === "Concussive") {
        if (p.lastMove === "Concussive") p.concussiveStreak++; else p.concussiveStreak = 0;
        let bonus = p.concussiveStreak * 5;
        dmg = 15 + bonus;
        combatLog.push(`Streak: ${p.concussiveStreak} (+${bonus})`);
        if (bonus >= 15) { combatEnemy.isStunned = true; combatLog.push("Enemy Stunned!"); p.concussiveStreak = 0; }
    }
    else if (skill.name === "Charged") {
        if (!p.isCharging) {
            p.isCharging = true;
            combatLog.push("Charging... (Turn Skipped)");
            endPlayerTurn(p, skill.name); return;
        } else {
            dmg = 60; p.isCharging = false;
            combatLog.push("UNLEASHED CHARGED PUNCH!");
        }
    }
    else if (skill.name === "Defend") { p.isDefending = true; combatLog.push("Reflecting next attack."); }
    else if (skill.name === "Shield") { p.shield += 35; combatLog.push("Gained 25 Shield."); }
    else if (skill.name === "Cover") { p.shield += 15; ally.shield += 20; combatLog.push("Shielded Team."); }
    else if (skill.name === "Slam") { p.shield = 0; dmg = 60; combatLog.push("Shields converted to SLAM!"); }
    else if (skill.name === "Debuff") { dmg = 10; combatEnemy.atkDebuff = (combatEnemy.atkDebuff || 0) + 10; combatLog.push("Enemy Atk reduced!"); }
    else if (skill.name === "Buff") { ally.atkBuff += 20; ally.hp = Math.min(ally.hp + 10, ally.maxHp); combatLog.push(`Buff applied! Ally attack +20 and healed for 10 HP.`); }
    else if (skill.name === "Freeze") { combatEnemy.isStunned = true; combatLog.push("Enemy Frozen!"); }
    else if (skill.name === "Heal") {     
        // Heal both players by 35 HP
    players.forEach(pl => {
        pl.hp = Math.min(pl.hp + 35, pl.maxHp);
    });
    combatLog.push("Both players healed for 35 HP!"); }

    if (selfDmg > 0) { p.hp -= selfDmg; combatLog.push(`Recoil: ${selfDmg} dmg.`); }
    if (dmg > 0) {
        dmg += p.atkBuff;
        if (p.items["gen_atk"]) dmg += (5 * p.items["gen_atk"]);
        combatEnemy.hp -= dmg;
        combatLog.push(`Dealt ${dmg} damage.`);
        if (p.atkBuff > 0) p.atkBuff = 0; 
    }
    // --- NEW: CLASS SPECIFIC EFFECTS ---
    // Assault: Burn effect for high cost attacks
    if (p.burnLevel > 0 && skill.cost >= 1) {
        let burnDmg = p.burnLevel * 5;
        combatEnemy.hp -= burnDmg;
        combatLog.push(`Burn effect! Dealt ${burnDmg} burn damage.`);
    }
    // Assault: Rage effect
    if (p.rageLevel > 0 && p.hp < p.maxHp * 0.3) {
        dmg *= 2;
        combatLog.push("Berserker Drive! Double damage due to low HP.");
    }
    // Sentinel: Auto-Repair
    if (p.autoRepairLevel > 0) {
        p.shield += p.autoRepairLevel * 5;
        combatLog.push(`Auto-Repair: Regained ${p.autoRepairLevel * 5} shield.`);
    }
    // Specialist: Biotic Amp
    if (p.bioticAmpLevel > 0) {
        if (skill.name === "Heal") {
            let amp = 1 + (0.5 + (p.bioticAmpLevel - 1) * 0.25);
            let healAmt = Math.floor(25 * amp);
            ally.hp = Math.min(ally.hp + healAmt, ally.maxHp);
            combatLog.push(`Biotic Amp: Healed ally for ${healAmt} HP.`);
        }
        if (skill.name === "Buff") {
            let amp = 1 + (0.5 + (p.bioticAmpLevel - 1) * 0.25);
            let buffAmt = Math.floor(20 * amp);
            ally.atkBuff += buffAmt;
            combatLog.push(`Biotic Amp: Buffed ally for ${buffAmt} attack.`);
        }
    }
    endPlayerTurn(p, skill.name);
}

function endPlayerTurn(player, skillName) {
    player.lastMove = skillName;
    if (combatEnemy.hp <= 0) {
        combatEnemy.hp = 0;
        
        if (isShortcutFight && shortcutActive !== null) {
            let s = SHORTCUTS[shortcutActive];
            partyPosition = s.target;
            shortcutActive = null;
            isShortcutFight = false;
            combatLog = ["Guardian Defeated!", "Taking Shortcut!", "P1 Roll Loot!"];
        } else {
            combatLog = [`Enemy Defeated!`, `Player 1, roll for loot!`];
        }

        combatPhase = "loot_roll";
        lootTurn = 0; 
    } else {
        setTimeout(enemyTurn, 1000);
        combatPhase = "enemy_turn"; 
    }
}

// ✅ Updated Loot RNG System with full item logic
function processLoot() {
    // 1. Roll Die (1-6)
    let roll = Math.floor(Math.random() * 6) + 1;
    let p = players[lootTurn];
    let logMsg = `Player ${lootTurn+1} rolled a ${roll}. `;
    let itemData = null;

    // 2. Determine Pool based on Roll
    if (roll <= 4) {
        let idx = Math.floor(Math.random() * GENERAL_ITEMS.length);
        itemData = GENERAL_ITEMS[idx];
        logMsg += "(General Loot) ";
    } else {
        let pool = CLASS_ITEMS[p.class];
        let idx = Math.floor(Math.random() * pool.length);
        itemData = pool[idx];
        logMsg += `(Unique ${p.class} Loot) `;
    }

    // 3. Apply Item Effects
    if (p.items[itemData.id]) {
        // Level-up
        p.items[itemData.id]++;
        logMsg += `Duplicate ${itemData.name}! Level ${p.items[itemData.id]}!`;

        switch(itemData.id) {
            case "gen_hp": p.maxHp += 5; p.hp += 5; break;
            case "gen_sp": p.maxSp += 1; p.sp += 1; break;
            case "gen_atk": /* handled in damage calc */ break;
            case "as_burn": p.burnLevel = p.items["as_burn"]; break;
            case "as_rage": /* effect stays same */ break;
            case "sen_ref":
                p.reflectLevel = p.items["sen_ref"];
                p.reflectRatio = Math.min(0.75 + 0.0625 * (p.reflectLevel - 1), 1.0);
                break;
            case "sen_reg": p.autoRepairLevel = p.items["sen_reg"]; break;
            case "spec_eff": p.efficiencyLevel = p.items["spec_eff"]; break;
            case "spec_pot": p.bioticAmpLevel = p.items["spec_pot"]; break;
        }
    } else {
        // First pickup
        p.items[itemData.id] = 1;
        logMsg += `Obtained ${itemData.name}!`;

        switch(itemData.id) {
            case "gen_hp": p.maxHp += 15; p.hp += 15; break;
            case "gen_sp": p.maxSp += 2; p.sp += 2; break;
            case "gen_atk": /* handled in damage calc */ break;
            case "as_burn": p.burnLevel = 1; break;
            case "as_rage": /* effect stays same */ break;
            case "sen_ref": p.reflectLevel = 1; p.reflectRatio = 0.75; break;
            case "sen_reg": p.autoRepairLevel = 1; break;
            case "spec_eff": p.efficiencyLevel = 1; break;
            case "spec_pot": p.bioticAmpLevel = 1; break;
        }
    }

    combatLog.push(logMsg);

    // 4. Advance Loot Turn
    if (lootTurn === 0) {
        lootTurn = 1;
        combatLog.push("Player 2, roll for loot!");
    } else {
        combatPhase = "victory";
    }
}

function enemyTurn() {
    if (combatPhase !== "enemy_turn") return;
    
    if (combatEnemy.isStunned) {
        combatLog.push("Enemy is Stunned!");
        combatEnemy.isStunned = false;
        passTurnToPlayer();
        return;
    }

    let roll = Math.floor(Math.random() * 6) + 1;
    let dmg = Math.max(0, combatEnemy.atk - (combatEnemy.atkDebuff || 0));
    let move = "Basic";

    if (roll >= 4 && roll <= 5) { dmg += 15; move = "Heavy"; }
    else if (roll === 6) { dmg += 35; move = "Special"; }

    let targetIdx = (Math.floor(Math.random() * 6) + 1 <= 3) ? 0 : 1;
    let target = players[targetIdx];
    let ally = players[1 - targetIdx];

    if (ally.isDefending && ally.class === "Sentinel") { target = ally; combatLog.push("Sentinel Defends!"); }

    let finalDmg = dmg;
    if (target.shield > 0) {
        if (target.shield >= finalDmg) { target.shield -= finalDmg; finalDmg = 0; combatLog.push("Blocked by Shield!"); }
        else { finalDmg -= target.shield; target.shield = 0; }
    }
    if (target.isDefending && finalDmg > 0) {
        let reflected = Math.floor(finalDmg * (target.reflectRatio || 0.5));
        finalDmg = Math.floor(finalDmg * (1 - (target.reflectRatio || 0.5)));
        combatEnemy.hp -= reflected;
        combatLog.push(`Reflected ${reflected} dmg!`);
        target.isDefending = false;
    }

    if (finalDmg > 0) {
        target.hp -= finalDmg;
        combatLog.push(`${combatEnemy.name} uses ${move} on P${players.indexOf(target)+1} for ${finalDmg} dmg.`);
    }

    if (combatEnemy.hp <= 0) { 
        endPlayerTurn(players[currentTurn], "Reflect");
        return; 
    } 

    passTurnToPlayer();
}

function passTurnToPlayer() {
    if (players[0].hp <= 0 && players[1].hp <= 0) {
        combatPhase = "game_over";
        return;
    }
    let next = 1 - currentTurn;
    if (players[next].hp <= 0) {
        combatLog.push(`Player ${next+1} is Down! P${currentTurn+1} acts again.`);
    } else {
        currentTurn = next;
    }
    players[currentTurn].sp = Math.min(players[currentTurn].sp + 2, players[currentTurn].maxSp);
    combatPhase = "player_turn";
}

    SKILL_2: {x: 280, y: 650, w: 200, h: 50},
    SKILL_3: {x: 510, y: 650, w: 200, h: 50},
    SKILL_4: {x: 740, y: 650, w: 200, h: 50},
    COMBAT_END: {x: 350, y: 600, w: 300, h: 60},
    RISK_YES: {x: 300, y: 400, w: 150, h: 50},
    RISK_NO: {x: 550, y: 400, w: 150, h: 50}
};

function handleClicks(x, y) {
    if (gameState === "main_menu") {
        if (isInside(x, y, BTN.START)) {
            gameState = "class_select";
            p1Class = null; p2Class = null; partyPosition = 0; currentTurn = 0;
            shortcutActive = null; isShortcutFight = false;
            gameLog = ["Game Start! Roll Dice."];
            players.forEach(p => { p.hp = p.maxHp; p.sp = 5; p.shield = 0; p.class = ""; p.lastMove = null; p.concussiveStreak = 0; p.isCharging = false; p.atkBuff = 0; p.isDefending = false; p.items = {};});
            return;
        }
        else if (isInside(x, y, BTN.HELP)) { gameState = "help"; helpPageIndex = 0; return; }
    }
    else if (["help", "settings", "about", "class_select"].includes(gameState)) {
        if (isInside(x, y, BTN.BACK)) { gameState = "main_menu"; return; }
    }

    if (gameState === "help") {
        if (isInside(x, y, BTN.NEXT) && helpPageIndex < HELP_PAGES.length - 1) helpPageIndex++;
        else if (isInside(x, y, BTN.PREV) && helpPageIndex > 0) helpPageIndex--;
    }

    else if (gameState === "class_select") {
        let selected = null;
        if (isInside(x, y, BTN.CLASS_1)) selected = "Assault";
        else if (isInside(x, y, BTN.CLASS_2)) selected = "Sentinel";
        else if (isInside(x, y, BTN.CLASS_3)) selected = "Specialist";

        if (selected) {
            if (!p1Class) { p1Class = selected; players[0].class = selected; }
            else if (!p2Class && selected !== p1Class) {
                p2Class = selected; players[1].class = selected;
                gameState = "game_board";
            }
        }
    }

    else if (gameState === "game_board") {
        // [NEW] Shortcut Logic - FIXED BRACKETS
        if (shortcutActive !== null) {
            if (isInside(x, y, BTN.RISK_YES)) {
                gameState = "combat";
                let s = SHORTCUTS[shortcutActive];
                combatEnemy = { ...ENEMIES.find(e => e.name === s.enemy) };
                combatEnemy.maxHp += 50; combatEnemy.hp = combatEnemy.maxHp; combatEnemy.atk += 5;
                isShortcutFight = true;
                combatPhase = "player_turn";
                combatLog = [`Guardian of ${s.name}!`, "Defeat to enter!"];
                players[currentTurn].sp = Math.min(players[currentTurn].sp + 2, players[currentTurn].maxSp);
            }
            else if (isInside(x, y, BTN.RISK_NO)) {
                shortcutActive = null;
                gameLog.push("Shortcut declined.");
            }
            return; // Exit here so we don't process the roll button below
        }

        // Normal Roll Logic
        if (isInside(x, y, BTN.ROLL)) {
            let roll = Math.floor(Math.random() * 6) + 1;
            dieRollResult = roll;
            let newPos = partyPosition + roll;
            if (newPos > 67) newPos = 67;
            partyPosition = newPos;
            
            if (SHORTCUTS[newPos]) {
                shortcutActive = newPos;
                gameLog.push(`Found ${SHORTCUTS[newPos].name}!`);
                return; 
            }

            gameLog.push(`Squad moved to Tile ${newPos+1}.`);
            gameState = "combat";
            startCombat(newPos);
        }
    }

    else if (gameState === "combat") {
        if (combatPhase === "victory" || combatPhase === "rest" || combatPhase === "safe") {
            if (isInside(x, y, BTN.COMBAT_END)) {
                gameState = "game_board"; return;
            }
        }
        else if (combatPhase === "game_over") {
             if (isInside(x, y, BTN.COMBAT_END)) { gameState = "main_menu"; return; }
        }
        else if (combatPhase === "loot_roll") {
             if (isInside(x, y, BTN.COMBAT_END)) processLoot();
        }
        else if (combatPhase === "player_turn") {
            if (isInside(x, y, BTN.SKILL_1)) playerUseSkill(0);
            else if (isInside(x, y, BTN.SKILL_2)) playerUseSkill(1);
            else if (isInside(x, y, BTN.SKILL_3)) playerUseSkill(2);
            else if (isInside(x, y, BTN.SKILL_4)) playerUseSkill(3);
        }
    }
}

// --- Drawing ---

function drawRect(rect, color) {
    ctx.fillStyle = color;
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
}

function drawText(text, x, y, size, color, align="center") {
    ctx.fillStyle = color;
    ctx.font = `${size}px Arial`;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
}

function drawButton(btn, text, color, subtext="") {
    drawRect(btn, color);
    drawText(text, btn.x + btn.w/2, btn.y + btn.h/2 + 5, 24, COLORS.WHITE);
    if (subtext) drawText(subtext, btn.x + btn.w/2, btn.y + btn.h/2 + 20, 12, COLORS.WHITE);
}

function gameLoop() {
    ctx.fillStyle = COLORS.BLACK;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === "main_menu") {
        drawText("AGHHH ALIENS!!!", 500, 150, 72, COLORS.ALIEN_GREEN);
        drawButton(BTN.START, "Start Game", COLORS.DARK_GRAY);
        drawButton(BTN.HELP, "Help / Rules", COLORS.DARK_GRAY);
    } 
    else if (gameState === "help") {
        drawButton(BTN.BACK, "< Back", COLORS.DARK_GRAY);
        let lines = HELP_PAGES[helpPageIndex];
        lines.forEach((line, i) => drawText(line, 500, 200 + (i*40), 24, COLORS.WHITE));
        drawButton(BTN.PREV, "Previous", COLORS.DARK_GRAY);
        drawButton(BTN.NEXT, "Next", COLORS.DARK_GRAY);
    }
    else if (gameState === "class_select") {
        drawButton(BTN.BACK, "< Back", COLORS.DARK_GRAY);
        let title = p1Class ? "Player 2: Choose Class" : "Player 1: Choose Class";
        drawText(title, 500, 100, 50, COLORS.WHITE);

        const drawCard = (btn, name, color, alreadyTaken) => {
            drawRect(btn, alreadyTaken ? COLORS.DARK_GRAY : color);
            drawText(name, btn.x + btn.w/2, btn.y + 60, 40, COLORS.BLACK);
            if (alreadyTaken) drawText("TAKEN", btn.x + btn.w/2, btn.y + 250, 50, COLORS.RED);
            else {
                let skills = CLASS_INFO[name];
                skills.forEach((line, i) => drawText(line, btn.x + btn.w/2, btn.y + 150 + (i*30), 18, COLORS.BLACK));
            }
        };
        drawCard(BTN.CLASS_1, "Assault", COLORS.ASSAULT, p1Class === "Assault");
        drawCard(BTN.CLASS_2, "Sentinel", COLORS.SENTINEL, p1Class === "Sentinel");
        drawCard(BTN.CLASS_3, "Specialist", COLORS.SPECIALIST, p1Class === "Specialist");
    }
    else if (gameState === "game_board") {
        // Draw Tiles
        boardTiles.forEach((t, i) => {
            let color = COLORS.RED;
            if (t.type === "blue") color = COLORS.BLUE;
            else if (t.type === "green") color = COLORS.SAFE_GREEN;
            else if (t.type === "gold") color = COLORS.GOLD;
            drawRect(t, color);
            drawText(i+1, t.x + t.w/2, t.y + t.h/2 + 5, 10, COLORS.WHITE);

            // Draw Shortcut Lines
            if (SHORTCUTS[i]) {
                let targetIdx = SHORTCUTS[i].target;
                let targetTile = boardTiles[targetIdx];
                ctx.beginPath();
                ctx.moveTo(t.x + 16, t.y + 16);
                ctx.lineTo(targetTile.x + 16, targetTile.y + 16);
                ctx.strokeStyle = COLORS.GOLD;
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });

        let squad = boardTiles[partyPosition];
        ctx.beginPath(); ctx.arc(squad.x+16, squad.y+16, 12, 0, 2*Math.PI); 
        ctx.fillStyle = COLORS.SQUAD_COLOR; ctx.fill();

        ctx.fillStyle = COLORS.DARK_GRAY;
        ctx.fillRect(0, 630, 1000, 120); 
        drawText(`Player ${currentTurn + 1}'s Turn`, 150, 670, 30, COLORS.ALIEN_GREEN);
        drawButton(BTN.ROLL, "Roll Die", COLORS.ALIEN_GREEN);
        
        ctx.textAlign = "left"; ctx.fillStyle = COLORS.WHITE; ctx.font = "14px Arial";
        gameLog.slice(-4).forEach((l, i) => ctx.fillText(l, 650, 660 + (i*20)));

        // [NEW] Shortcut Popup
        if (shortcutActive !== null) {
             ctx.fillStyle = "rgba(0,0,0,0.9)";
             ctx.fillRect(150, 200, 700, 300);
             ctx.strokeStyle = COLORS.GOLD;
             ctx.strokeRect(150, 200, 700, 300);
             let s = SHORTCUTS[shortcutActive];
             ctx.textAlign = "center";
             drawText(`SHORTCUT: ${s.name}`, 500, 260, 40, COLORS.GOLD);
             drawText(`Skip to Tile ${s.target}?`, 500, 320, 30, COLORS.WHITE);
             drawText(`RISK: Defeat Buffed ${s.enemy}`, 500, 360, 24, COLORS.RED);
             drawButton(BTN.RISK_YES, "RISK IT", COLORS.RED);
             drawButton(BTN.RISK_NO, "DECLINE", COLORS.GRAY);
        }
    }
    else if (gameState === "combat") {
        // --- Combat Screen ---
        if (combatPhase === "safe") {
            drawText("SAFE ZONE", 500, 150, 50, COLORS.SAFE_GREEN);
        } else if (combatPhase !== "rest") {
            let name = combatEnemy.name;
            if (isShortcutFight) name = "Guardian " + name;
            drawText(name, 500, 100, 40, COLORS.RED);
            drawText(`HP: ${combatEnemy.hp}/${combatEnemy.maxHp}`, 500, 150, 30, COLORS.WHITE);
            let hpPercent = Math.max(0, combatEnemy.hp / combatEnemy.maxHp);
            ctx.fillStyle = COLORS.GRAY; ctx.fillRect(300, 170, 400, 20);
            ctx.fillStyle = COLORS.RED; ctx.fillRect(300, 170, 400 * hpPercent, 20);
        } else {
            drawText("REST POINT", 500, 150, 50, COLORS.BLUE);
        }

        ctx.textAlign = "center"; ctx.font = "20px Arial"; ctx.fillStyle = COLORS.WHITE;
        combatLog.slice(-5).forEach((l, i) => ctx.fillText(l, 500, 300 + (i*30)));
// ✅ Helper Function for item names
function getItemName(id) {
    const allItems = [
        ...GENERAL_ITEMS,
        ...CLASS_ITEMS["Assault"],
        ...CLASS_ITEMS["Sentinel"],
        ...CLASS_ITEMS["Specialist"]
    ];
    let found = allItems.find(item => item.id === id);
    return found ? found.name : id;
}

        // ✅ Updated drawStats with item display and font reset
        const drawStats = (p, x, label) => {
            // Player header
            let color = (label === `Player ${currentTurn+1}`) ? COLORS.ALIEN_GREEN : COLORS.WHITE;
            drawText(label + ` (${p.class})`, x, 500, 24, color);
            // Stats
            drawText(`HP: ${p.hp}/${p.maxHp}`, x, 530, 20, COLORS.HP_BAR);
            drawText(`SP: ${p.sp}/${p.maxSp}`, x, 560, 20, COLORS.SP_BAR);
            if (p.shield > 0) drawText(`Shield: ${p.shield}`, x, 590, 20, COLORS.BLUE);

            // ✅ NEW: Display items just below stats
            let itemY = 610; // closer to stats
            ctx.textAlign = "center";
            ctx.font = "14px Arial";
            ctx.fillStyle = COLORS.WHITE;

            let itemKeys = Object.keys(p.items);
            if (itemKeys.length > 0) {
                itemKeys.forEach((id, i) => {
                    let level = p.items[id];
                    let itemName = getItemName(id);
                    drawText(`${itemName} (Lv${level})`, x, itemY + (i * 18), 14, COLORS.WHITE);
                });
            } else {
                drawText("No Items", x, itemY, 14, COLORS.GRAY);
            }

            // ✅ Restore font and alignment for other UI elements
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
        };
        drawStats(players[0], 200, "Player 1");
        drawStats(players[1], 800, "Player 2");

        // Draw Controls
        if (combatPhase === "player_turn") {
            let p = players[currentTurn];
            let skills = SKILLS[p.class];
            drawButton(BTN.SKILL_1, skills[0].name, COLORS.DARK_GRAY, `${skills[0].cost} SP`);
            drawButton(BTN.SKILL_2, skills[1].name, COLORS.DARK_GRAY, `${skills[1].cost} SP`);
            drawButton(BTN.SKILL_3, skills[2].name, COLORS.DARK_GRAY, `${skills[2].cost} SP`);
            drawButton(BTN.SKILL_4, skills[3].name, COLORS.DARK_GRAY, `${skills[3].cost} SP`);
            drawText(`It is Player ${currentTurn+1}'s turn! Choose a skill.`, 500, 620, 20, COLORS.ALIEN_GREEN);
        } 
        else if (combatPhase === "loot_roll") {
            drawButton(BTN.COMBAT_END, `P${lootTurn+1}: Roll for Loot`, COLORS.ALIEN_GREEN);
        }
        else if (combatPhase === "victory" || combatPhase === "rest" || combatPhase === "safe") {
            drawButton(BTN.COMBAT_END, "Continue Journey", COLORS.ALIEN_GREEN);
        }
        else if (combatPhase === "game_over") {
            drawText("GAME OVER", 500, 600, 50, COLORS.RED);
            drawButton(BTN.COMBAT_END, "Try Again", COLORS.RED);
        }
        else if (combatPhase === "enemy_turn") {
            drawText("Alien is attacking...", 500, 650, 30, COLORS.RED);
        }
    }
    requestAnimationFrame(gameLoop);
}

init();

</script>
